<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f6f8" />
    <meta name="description" content="CreatorTools — evidence-backed opportunity intelligence. Find real problems people are trying to solve, turn them into products, and build the system to sell them." />
    <title>CreatorTools — Opportunity Intelligence</title>
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- ---------------------------------------------------------- icons ---
         Order matters: browsers pick the first format they understand, so the
         vector goes first and the raster set follows for older engines.
         All paths are root-relative and copied verbatim into dist/ by Vite. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32x32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-16x16.png" sizes="16x16" type="image/png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/icons/safari-pinned-tab.svg" color="#7c5cff" />

    <!-- ------------------------------------------------------- share card ---
         og:image must be absolute for every scraper; swap the origin here and
         in the canonical/og:url tags when you deploy. -->
    <link rel="canonical" href="https://creatortools.app/" />
    <meta name="theme-color" content="#f6f6f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17171a" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="CreatorTools" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CreatorTools" />
    <meta property="og:title" content="CreatorTools — Stop guessing what to sell." />
    <meta property="og:description" content="Find real problems people are trying to solve, turn them into products, and build the system to sell them." />
    <meta property="og:url" content="https://creatortools.app/" />
    <meta property="og:image" content="https://creatortools.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="CreatorTools — evidence-backed opportunity intelligence." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CreatorTools — Stop guessing what to sell." />
    <meta name="twitter:description" content="Find real problems people are trying to solve, turn them into products, and build the system to sell them." />
    <meta name="twitter:image" content="https://creatortools.app/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
